[package]
name = "readable_core"
version = "0.1.0"
edition = "2021"
description = "Pure Rust readability extractor using logistic regression"
license = "MIT"

[dependencies]
# HTML parsing
html5ever = "0.27"
markup5ever_rcdom = "0.3"

# Serialization for options/debug output
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Lazy initialization
lazy_static = "1.5"

[dev-dependencies]
pretty_assertions = "1.4"

[features]
default = []
debug = []
